[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "staff-graded-xblock"
dynamic = ["version"]
description = "Staff Graded XBlock"
readme = "README.rst"
license = "AGPL-3.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
]
requires-python = ">=3.12"
dependencies = [
    "edx-bulk-grades",
    "markdown",
    "path.py",
    "XBlock",
]

[project.urls]
Homepage = "https://github.com/openedx/staff_graded-xblock"

[project.entry-points."xblock.v1"]
staffgradedxblock = "staff_graded:StaffGradedXBlock"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
staff_graded = ["static/**/*", "public/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*", "spec*", "*.spec*"]

[tool.coverage.run]
branch = true
source = ["staff_graded"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/settings.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
