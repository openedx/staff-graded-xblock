[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "staff-graded-xblock"
dynamic = ["version"]
description = "Staff Graded XBlock"
readme = "README.rst"
license = "AGPL-3.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
]
requires-python = ">=3.12"
dependencies = [
    "edx-bulk-grades",
    "markdown",
    "path.py",
    "XBlock",
]

[project.urls]
Homepage = "https://github.com/openedx/staff_graded-xblock"

[project.entry-points."xblock.v1"]
staffgradedxblock = "staff_graded:StaffGradedXBlock"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
staff_graded = ["static/**/*", "public/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "*.tests*", "spec*", "*.spec*"]

[tool.coverage.run]
branch = true
source = ["staff_graded"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/settings.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
test-base = [
    "edx-lint",
    "pytest-cov",
    "django-statici18n",
]
# Default test group uses latest supported Django version.
# To run against Django 4.2: uv run --group django42 tox -e django42
# To add a new Django version: add a new group (e.g. django60) and update tox.ini envlist.
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<4.3",
]
quality = [
    {include-group = "test"},
]
ci = [
    "tox>=4",
    "tox-uv>=1",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    "edx-i18n-tools",
]

[tool.edx_lint]
# Repo-specific version overrides — populated by: make upgrade
# [tool.uv] constraint-dependencies below is machine-managed; edit uv_constraints here instead.
uv_constraints = []

# machine-managed — do not edit directly; run: make upgrade
[tool.uv]
package = true
conflicts = [
    [
        {group = "test"},
        {group = "django42"},
    ],
]
constraint-dependencies = []
