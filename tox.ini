[tox]
envlist = django{42,52}, quality
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
allowlist_externals =
    make
dependency_groups =
    django42: django42
    django52: test
commands =
    make test

[testenv:quality]
runner = uv-venv-lock-runner
allowlist_externals =
    make
dependency_groups = quality
commands =
    make quality
