[tox]
envlist = django{42,52}, quality
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands =
    pytest

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    pylint --rcfile=pylintrc src/staff_graded
